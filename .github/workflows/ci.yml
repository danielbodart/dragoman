name: CI

on:
  push:
    branches: [main]
    # The release job commits the refreshed marketplace pointer back to main.
    # Ignoring that path stops the bot commit from re-triggering CI (no loop).
    paths-ignore:
      - .claude-plugin/marketplace.json
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs on the same ref so release jobs never race on the
# marketplace-pointer push. cancel-in-progress:false → queue, don't cancel,
# so an in-flight release finishes publishing before the next one starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # Full history: version() derives the minor from the commit
        # count, which a shallow clone gets wrong (and the script refuses).
        # A token that can push is needed for the marketplace-pointer commit.
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: jdx/mise-action@v4

      # Everything real lives in mise tasks, so local dev runs the same steps.
      - run: mise run ci

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
