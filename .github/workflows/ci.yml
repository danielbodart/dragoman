name: CI

on:
  push:
    branches: [main]
    # The release job commits the refreshed marketplace pointer back to main.
    # Ignoring that path stops the bot commit from re-triggering CI (no loop).
    paths-ignore:
      - .claude-plugin/marketplace.json
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # Full history: run.ts's version() derives the minor from the commit
        # count, which a shallow clone gets wrong (and the script refuses).
        # A token that can push is needed for the marketplace-pointer commit.
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: jdx/mise-action@v4
      - run: mise run check
      - run: mise run test

      - name: Package plugin archive (all platforms)
        run: mise run package

      - name: Derive release facts
        id: facts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          v="$(bun run.ts version)"
          sha="$(sha256sum dist/dragoman-plugin.zip | awk '{print $1}')"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.facts.outputs.version }}
          name: v${{ steps.facts.outputs.version }}
          files: |
            dist/dragoman-plugin.zip
            dist/plugin/bin/dragoman-darwin-arm64
            dist/plugin/bin/dragoman-darwin-x64
            dist/plugin/bin/dragoman-linux-x64
            dist/plugin/bin/dragoman-linux-arm64

      - name: Point marketplace at the new release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          V: ${{ steps.facts.outputs.version }}
          SHA: ${{ steps.facts.outputs.sha256 }}
        run: |
          bun -e '
            const f = ".claude-plugin/marketplace.json";
            const m = JSON.parse(await Bun.file(f).text());
            const p = m.plugins.find((p) => p.name === "dragoman");
            p.version = process.env.V;
            p.source.url = `https://github.com/danielbodart/dragoman/releases/download/v${process.env.V}/dragoman-plugin.zip`;
            p.source.sha256 = process.env.SHA;
            await Bun.write(f, JSON.stringify(m, null, 2) + "\n");
          '
          if git diff --quiet .claude-plugin/marketplace.json; then
            echo "marketplace.json already current"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          git commit -m "release: point marketplace at v$V [skip ci]"
          # A concurrent push can win the race; the next release re-points, so a
          # failed push is a warning, not a build failure.
          git push origin HEAD:main || echo "::warning::marketplace pointer push raced; next release will re-point"
