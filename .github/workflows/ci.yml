name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history: run.ts's version() derives the minor from the commit
        # count, which a shallow clone gets wrong (and the script refuses).
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: mise run check
      - run: mise run test
      - run: mise run build
      - name: Derive release version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "version=$(bun run.ts version)" >> "$GITHUB_OUTPUT"
      - name: Prepare release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp dist/dragoman dist/dragoman-linux-x64
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: dist/dragoman-linux-x64
