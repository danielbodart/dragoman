# The toolchain for the dev loop and for CI, which both go through these
# tasks. The weekly update moves each tool to the latest patch of its minor;
# a new minor moves here by hand.
[tools]
go = "1.27.3"
# Signs the release assets, keyless, in CI.
cosign = "3.0.6"

# What a release is built from. A change to any of these since the last
# release tag releases (mise run release-due, which CI and the weekly update
# ask); anything else - docs, workflows, PLAN.md - goes out with the next
# release one of these makes.
[env]
RELEASE_PATHS = "main.go internal go.mod go.sum mise.toml run MAJOR packaging skills agents .claude-plugin/plugin.json generated"

[tasks.lint]
description = "gofmt, go vet, and the generated protocol up to date"
run = "./run lint"

[tasks.test]
description = "Unit tests"
run = "./run test"

[tasks.check]
description = "Lint and unit tests: the dev loop, and CI's first gate"
depends = ["lint", "test"]

[tasks.integration]
description = "Live tests against a real codex: model-free, or every one with DRAGOMAN_MODEL_TESTS=1"
run = "./run integration"

# build and dist declare no sources to skip on: the version they stamp in is
# the commit count and the CI run number (or the time), which change when no
# source does, so a skipped run would ship an old version. Go's own build
# cache is what makes a rerun cheap.
[tasks.build]
description = "A static binary for this machine, into dist/"
run = "./run build"

[tasks.dist]
description = "Every platform's binary, the plugin zip and SHA256SUMS, into dist/"
run = "./run dist"

# A dev-only task, after a codex upgrade; CI never runs it.
[tasks.regen-protocol]
description = "Regenerate the protocol's JSON Schema from the installed codex, and the Go from it"
run = "./run regen-protocol"

[tasks.release-due]
description = "Succeed if anything in RELEASE_PATHS changed since the last release tag, or there is none; fail otherwise"
run = "./run release-due"
